# Docker Compose configuration for CPU-only environments
version: '3.8'

services:
  # CPU-only development environment
  pyrkm-dev-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu-only
    image: pyrkm:dev-cpu
    container_name: pyrkm-dev-cpu
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - .:/app
      - pyrkm-data-cpu:/app/datasets
      - pyrkm-models-cpu:/app/model_states
      - pyrkm-logs-cpu:/app/logs
    working_dir: /app
    stdin_open: true
    tty: true
    command: bash

  # Jupyter Lab CPU-only
  pyrkm-jupyter-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu-only
    image: pyrkm:jupyter-cpu
    container_name: pyrkm-jupyter-cpu
    environment:
      - PYTHONPATH=/app/src
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - .:/app
      - pyrkm-data-cpu:/app/datasets
      - pyrkm-models-cpu:/app/model_states
      - pyrkm-logs-cpu:/app/logs
    ports:
      - "8888:8888"
    working_dir: /app
    command: >
      bash -c "pip install jupyter jupyterlab &&
               jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root"

volumes:
  pyrkm-data-cpu:
    driver: local
  pyrkm-models-cpu:
    driver: local
  pyrkm-logs-cpu:
    driver: local
